<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WYSIWYG &middot; Adds &middot; Amazon</title>
<style>
    :root {
        --bg: #f4f6f9;
        --panel: #ffffff;
        --text: #1a1a1a;
        --muted: #6b7280;
        --border: #d0d5dd;
        --accent: #0000ff;
        --accent-soft: #eef3fb;
        --btn: #0000ff;
        --btn-text: #ffffff;
    }
    body.dark {
        --bg: #1b1d21;
        --panel: #25282e;
        --text: #e6e6e6;
        --muted: #9aa0a6;
        --border: #3a3f47;
        --accent: #ffd400;
        --accent-soft: #2c2f36;
        --btn: #ffd400;
        --btn-text: #111111;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 18px;
    }
    h2 { margin: 0 0 4px; font-size: 18px; color: var(--accent); }
    .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    input[type="text"] {
        flex: 1;
        min-width: 260px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font-size: 14px;
    }
    button.scrape-btn {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background: var(--btn);
        color: var(--btn-text);
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }
    button.scrape-btn:disabled { opacity: 0.55; cursor: wait; }
    button.ghost {
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
    }
    .status { font-size: 12px; color: var(--muted); margin-bottom: 8px; min-height: 16px; }
    .status.err { color: #c62828; }
    .status.ok { color: #2e7d32; }
    label.lbl { font-size: 12px; font-weight: 600; color: var(--muted); display:block; margin-bottom: 8px; }

    /* --- Result field rows --- */
    .results { margin-top: 2px; }
    .section-title {
        font-size: 13px;
        font-weight: 700;
        margin: 16px 0 6px;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }
    .field-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 6px;
    }
    .field-label {
        flex: 0 0 190px;
        width: 190px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        padding-top: 8px;
        word-break: break-word;
    }
    .field-val {
        flex: 1 1 auto;
        min-width: 0;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
        resize: vertical;
    }
    .copy-one {
        flex: 0 0 72px;
        width: 72px;
        padding: 7px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
    }
    .copy-one:hover { background: var(--accent-soft); }
    .copy-spacer {
        flex: 0 0 72px;
        width: 72px;
    }
    /* --- Subject Keyword group --- */
    .kw-group {
        margin-bottom: 8px;
    }
    .kw-line {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 6px;
    }
    .kw-del {
        flex: 0 0 26px;
        width: 26px;
        align-self: center;
        padding: 4px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
    }
    .kw-del:hover { background: #d9534f; color: #fff; border-color: #d9534f; }
    .kw-val {
        flex: 1 1 auto;
        min-width: 0;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
        resize: vertical;
    }
    .kw-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin: 4px 0 2px;
    }
    .kw-copyline {
        flex: 0 0 72px;
        width: 72px;
        padding: 7px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        text-align: center;
        box-sizing: border-box;
    }
    .kw-copyline:hover { background: var(--accent-soft); }
    .kw-spacer {
        flex: 0 0 72px;
        width: 72px;
    }
    /* --- Always-on-top pin --- */
    #aapTopbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 0 0 10px;
        background: var(--bg);
    }
    #aapViewMode {
        font-size: 13px;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        cursor: pointer;
    }
    #aapPinBtn.pinned {
        background: var(--accent);
        color: var(--btn-text);
        border-color: var(--accent);
    }
    #aapWrap.pinned {
        position: fixed !important;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2147483647;
        background: var(--bg);
        padding: 18px;
        overflow: auto;
        max-height: 100vh;
        box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
</style>
</head>
<body>
    <div id="aapTopbar">
        <label style="font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px;">
            View:
            <select id="aapViewMode" onchange="onAapViewChange()">
                <option value="Full" selected>Full</option>
                <option value="Small">Small</option>
            </select>
        </label>
        <button id="aapPinBtn" class="ghost" onclick="toggleAapPin()">📌 Always on top: OFF</button>
    </div>
    <h2>Adds &middot; Amazon</h2>
    <div class="sub">Paste a Discogs seller / release link (e.g. https://www.discogs.com/shop/item/4330873320). Data is pulled via the Discogs API and laid out using the Amazon Adds scraper.</div>

    <div class="row">
        <input type="text" id="urlInput" placeholder="Paste Discogs URL here..." autocomplete="off" spellcheck="false">
        <button class="scrape-btn" id="scrapeBtn">Scrape</button>
        <button class="ghost" id="copyAllBtn">Copy All</button>
    </div>
    <div class="status" id="status"></div>
    <label class="lbl">Scraped output</label>
    <div class="results" id="results"></div>

<script>
(async function () {
    const urlInput = document.getElementById('urlInput');
    const scrapeBtn = document.getElementById('scrapeBtn');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const statusEl = document.getElementById('status');
    const results = document.getElementById('results');
    let lastText = '';

    // Match the app's dark/light theme from localStorage if present.
    try {
        const t = localStorage.getItem('wysiwyg_theme');
        if (t === 'dark') document.body.classList.add('dark');
    } catch (e) {}

    function setStatus(msg, kind) {
        statusEl.textContent = msg || '';
        statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    // Subject Keyword group: each comma-separated token is its own
    // deletable + editable row, with a "Copy Line" button that joins
    // the survivors into a single "item1, item2, ..." string.
    function renderKeywordGroup(value) {
        const group = document.createElement('div');
        group.className = 'kw-group';

        const lbl = document.createElement('div');
        lbl.className = 'field-label';
        lbl.textContent = 'Subject Keyword';
        group.appendChild(lbl);

        const tokens = value.split(',').map((t) => t.trim()).filter((t) => t.length);

        const list = document.createElement('div');
        list.className = 'kw-list';
        tokens.forEach((tok) => {
            const line = document.createElement('div');
            line.className = 'kw-line';

            const del = document.createElement('button');
            del.className = 'kw-del';
            del.type = 'button';
            del.textContent = '✕';
            del.title = 'Delete this keyword';

            const ta = document.createElement('textarea');
            ta.className = 'kw-val';
            ta.value = tok;
            ta.rows = 1;

            const copy = document.createElement('button');
            copy.className = 'copy-one';
            copy.type = 'button';
            copy.textContent = 'Copy';

            line.appendChild(del);
            line.appendChild(ta);
            line.appendChild(copy);
            list.appendChild(line);
        });
        group.appendChild(list);

        const actions = document.createElement('div');
        actions.className = 'kw-actions';
        const copyLine = document.createElement('button');
        copyLine.className = 'kw-copyline';
        copyLine.type = 'button';
        copyLine.textContent = 'Copy Line';
        const spacer = document.createElement('div');
        spacer.className = 'kw-spacer';
        actions.appendChild(copyLine);
        actions.appendChild(spacer);
        group.appendChild(actions);

        results.appendChild(group);
    }

    // Turn the scraped markdown text into copy-friendly field rows.
    function renderResults(text) {
        lastText = text || '';
        results.innerHTML = '';
        let pendingKeywords = [];
        // "Small" view shows only the core offer fields; "Full" shows everything.
        const mode = (document.getElementById('aapViewMode') || {}).value || 'Full';
        const SMALL_FIELDS = ['SKU', 'Your Price', 'Item Condition', 'Offer Condition Note', 'Product Tax Code'];
        const isSmall = (mode === 'Small');
        const lines = text.split('\n');
        for (const raw of lines) {
            const line = raw.trimEnd();
            if (!line.trim()) continue;
            if (line.startsWith('Section')) {
                if (isSmall) continue;  // hide section headers in Small view
                const h = document.createElement('div');
                h.className = 'section-title';
                h.dataset.full = line;
                h.textContent = line.replace(/^Section\s*\d+:\s*/, '');
                results.appendChild(h);
                continue;
            }
            // Field line: "Label - Value" (split on the first " - ").
            const idx = line.indexOf(' - ');
            let label = '';
            let value = line;
            if (idx !== -1) {
                label = line.slice(0, idx).trim();
                value = line.slice(idx + 3).trim();
            }

            // Subject Keyword may arrive as one comma-joined line OR several
            // "Subject Keyword - X" lines. Fold them all into a single group.
            if (label === 'Subject Keyword') {
                if (isSmall) continue;  // not part of the Small view
                pendingKeywords.push(value);
                continue;
            }
            // In Small view, only keep the designated core offer fields.
            if (isSmall && !SMALL_FIELDS.includes(label)) continue;

            // A non-keyword line ends any accumulated keyword block.
            if (pendingKeywords.length) {
                renderKeywordGroup(pendingKeywords.join(', '));
                pendingKeywords = [];
            }

            const row = document.createElement('div');
            row.className = 'field-row';

            const lbl = document.createElement('div');
            lbl.className = 'field-label';
            lbl.textContent = label;

            const val = document.createElement('textarea');
            val.className = 'field-val';
            val.value = value;
            val.dataset.label = label;
            val.rows = Math.max(1, Math.min(8, Math.ceil(value.length / 60)));

            row.appendChild(lbl);
            row.appendChild(val);

            // Skip the Copy button for rows the user edits manually,
            // but keep a 72px spacer so every text box aligns at the same width.
            const NO_COPY = ['Upload Photos', 'Merchant Shipping Group', 'Quantity'];
            if (label && !NO_COPY.includes(label)) {
                const btn = document.createElement('button');
                btn.className = 'copy-one';
                btn.type = 'button';
                btn.textContent = 'Copy';
                row.appendChild(btn);
            } else {
                const spacer = document.createElement('div');
                spacer.className = 'copy-spacer';
                row.appendChild(spacer);
            }
            results.appendChild(row);
        }
        if (pendingKeywords.length) {
            renderKeywordGroup(pendingKeywords.join(', '));
        }
    }

    // Re-render the last scrape in the newly selected view (no re-scrape needed).
    function onAapViewChange() {
        renderResults(lastText);
    }

    async function flashCopied(btn) {
        const old = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = old; }, 1200);
    }

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch (e) {
            return false;
        }
    }

    // Delegated clicks inside the results area.
    results.addEventListener('click', async (e) => {
        // Delete a single Subject Keyword token.
        const del = e.target.closest('.kw-del');
        if (del) {
            const line = del.closest('.kw-line');
            if (line) line.remove();
            return;
        }
        // Copy Line: join the remaining keyword tokens with ", ".
        const cl = e.target.closest('.kw-copyline');
        if (cl) {
            const group = cl.closest('.kw-group');
            const vals = [];
            if (group) {
                group.querySelectorAll('.kw-line .kw-val').forEach((ta) => {
                    const v = ta.value.trim();
                    if (v) vals.push(v);
                });
            }
            const text = vals.join(' ');
            if (!text) { setStatus('No keywords left to copy.', 'err'); return; }
            const ok = await copyText(text);
            setStatus(ok ? 'Copied line: ' + text : 'Copy failed.', ok ? 'ok' : 'err');
            if (!ok) { /* clipboard blocked; nothing else we can do here */ }
            return;
        }
        // Per-row copy (Copy buttons everywhere, incl. keyword rows).
        const btn = e.target.closest('.copy-one');
        if (!btn) return;
        const ta = btn.previousElementSibling;        // the editable textarea
        const v = ta ? ta.value : '';
        if (!v) return;
        const ok = await copyText(v);
        if (!ok && ta) { ta.select(); document.execCommand('copy'); }
        flashCopied(btn);
    });

    copyAllBtn.addEventListener('click', async () => {
        const parts = [];
        results.querySelectorAll('.section-title').forEach((h) => {
            parts.push(h.dataset.full || h.textContent);
        });
        results.querySelectorAll('.field-row').forEach((row) => {
            const lbl = row.querySelector('.field-label');
            const val = row.querySelector('.field-val');
            if (lbl && val) parts.push(lbl.textContent + ' - ' + val.value);
        });
        results.querySelectorAll('.kw-group').forEach((grp) => {
            const label = grp.querySelector('.field-label');
            const vals = [];
            grp.querySelectorAll('.kw-line .kw-val').forEach((ta) => {
                const v = ta.value.trim();
                if (v) vals.push(v);
            });
            if (label) parts.push(label.textContent + ' - ' + vals.join(' '));
        });
        const text = parts.join('\n');
        if (!text.trim()) { setStatus('Nothing to copy yet.', 'err'); return; }
        const ok = await copyText(text);
        setStatus(ok ? 'Copied all (with your edits) to clipboard.' : 'Copy failed.', ok ? 'ok' : 'err');
    });

    async function doScrape() {
        const url = urlInput.value.trim();
        if (!url) {
            setStatus('Paste a Discogs URL first.', 'err');
            return;
        }
        scrapeBtn.disabled = true;
        scrapeBtn.textContent = 'Scraping...';
        results.innerHTML = '';
        lastText = '';
        setStatus('Fetching from Discogs API...');
        try {
            const resp = await fetch('/api/adds/amazon-scrape', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const data = await resp.json();
            if (data.status === 'success') {
                lastText = data.text;
                renderResults(data.text);
                setStatus('Done.', 'ok');
            } else {
                results.innerHTML = '';
                setStatus('Error: ' + (data.message || 'Unknown error'), 'err');
            }
        } catch (e) {
            setStatus('Request failed: ' + e, 'err');
        } finally {
            scrapeBtn.disabled = false;
            scrapeBtn.textContent = 'Scrape';
        }
    }

    // (a) Auto-paste the clipboard on load.
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.clipboard && navigator.clipboard.readText) {
                const txt = (await navigator.clipboard.readText()).trim();
                if (txt) {
                    urlInput.value = txt;
                    // (b)+(c) auto-trigger scrape when we have a URL from clipboard
                    doScrape();
                }
            }
        } catch (e) {
            // Clipboard read may be blocked without permission; ignore.
        }
    });

    // Manual scrape button
    scrapeBtn.addEventListener('click', doScrape);

    // Auto-trigger when a URL is pasted manually into the box.
    urlInput.addEventListener('paste', (e) => {
        // Let the paste land, then scrape.
        setTimeout(doScrape, 0);
    });
})();
</script>
<script>
// Always-on-top pin for the Amazon Adds page (in-page; wraps content and
// floats it above other in-page content). Global so the inline onclick works.
function toggleAapPin() {
    let wrap = document.getElementById('aapWrap');
    if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = 'aapWrap';
        const topbar = document.getElementById('aapTopbar');
        const toMove = [];
        for (const child of Array.from(document.body.children)) {
            if (child !== topbar) toMove.push(child);
        }
        for (const child of toMove) wrap.appendChild(child);
        document.body.insertBefore(wrap, topbar.nextSibling);
    }
    const on = wrap.classList.toggle('pinned');
    const btn = document.getElementById('aapPinBtn');
    btn.classList.toggle('pinned', on);
    btn.textContent = on ? '📌 Always on top: ON' : '📌 Always on top: OFF';
}
</script>
</body>
</html>
